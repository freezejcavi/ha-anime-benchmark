name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate model bundle
        run: python tools/validate_bundle.py

      - name: Validate tracker catalog
        run: python tools/validate_catalog.py
      - name: Compile Python sources
        run: python -m compileall -q custom_components tools

      - name: Check runtime slot assignments
        run: python tools/check_runtime_slots.py
      - name: Check frontend syntax
        shell: bash
        run: |
          for file in custom_components/anime_benchmark/static/*.js; do
            node --check "$file"
          done
