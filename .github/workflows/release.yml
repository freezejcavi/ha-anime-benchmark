name: Release

on:
  push:
    branches:
      - main
    paths:
      - ".release-version"
      - ".github/workflows/release.yml"

permissions:
  contents: write

concurrency:
  group: anime-benchmark-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Read and validate release version
        id: version
        shell: bash
        run: |
          VERSION="$(python - <<'PY'
          import json
          import re
          from pathlib import Path

          marker = Path(".release-version").read_text(encoding="utf-8").strip()
          manifest = json.loads(
              Path("custom_components/anime_benchmark/manifest.json").read_text(encoding="utf-8")
          )
          version = str(manifest["version"])

          if not re.fullmatch(r"\d+\.\d+\.\d+", version):
              raise SystemExit(f"Invalid semantic version: {version}")
          if marker != version:
              raise SystemExit(
                  f"Release marker {marker!r} does not match manifest version {version!r}"
              )

          print(version)
          PY
          )"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Preparing release v$VERSION"

      - name: Validate model bundle
        run: python tools/validate_bundle.py

      - name: Validate tracker catalog
        run: python tools/validate_catalog.py

      - name: Compile Python sources
        run: python -m compileall -q custom_components tools

      - name: Check runtime slot assignments
        run: python tools/check_runtime_slots.py

      - name: Check frontend syntax
        shell: bash
        run: |
          for file in custom_components/anime_benchmark/static/*.js; do
            node --check "$file"
          done

      - name: Check whether release already exists
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists; nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          gh release create "$TAG"             --repo "$GITHUB_REPOSITORY"             --target "$GITHUB_SHA"             --title "$TAG"             --generate-notes

          echo "Created release $TAG"
