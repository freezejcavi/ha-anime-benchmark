name: Release

on:
  push:
    branches:
      - main
    paths:
      - "custom_components/anime_benchmark/manifest.json"
      - ".github/workflows/release.yml"

permissions:
  contents: write

concurrency:
  group: anime-benchmark-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Read and validate version
        id: version
        shell: bash
        run: |
          VERSION="$(python - <<'PY'
          import json
          import re
          from pathlib import Path

          manifest = json.loads(
              Path("custom_components/anime_benchmark/manifest.json").read_text(encoding="utf-8")
          )
          version = manifest["version"]
          if not re.fullmatch(r"\d+\.\d+\.\d+", version):
              raise SystemExit(f"Invalid semantic version: {version}")
          print(version)
          PY
          )"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Preparing release v$VERSION"

      - name: Validate model bundle
        run: python tools/validate_bundle.py

      - name: Compile Python sources
        run: python -m compileall -q custom_components tools

      - name: Check frontend syntax
        run: node --check custom_components/anime_benchmark/static/anime-benchmark-card.js

      - name: Check whether release already exists
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists; nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          gh release create "$TAG"             --repo "$GITHUB_REPOSITORY"             --target "$GITHUB_SHA"             --title "$TAG"             --generate-notes

          echo "Created release $TAG"
